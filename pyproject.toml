[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ovos_phal_plugin_ipgeo"
dynamic = ["version"]
description = "A PHAL plugin for mycroft"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "JarbasAi", email = "jarbasai@mailfence.com"}
]
requires-python = ">=3.6"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Text Processing :: Linguistic",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3"
]
dependencies = [
    "ovos-plugin-manager>=0.0.1,<3.0.0",
    "ovos-config>=0.0.10",
    "ovos-utils>=0.4.0"
]

[project.optional-dependencies]
test = [
    "pytest",
    "ovos-bus-client>=0.0.3,<3.0.0"
]

[project.urls]
Homepage = "https://github.com/OpenVoiceOS/ovos-PHAL-plugin-ipgeo"

[project.entry-points."opm.phal"]
"ovos-phal-plugin-ipgeo" = "ovos_phal_plugin_ipgeo:IPGeoPlugin"

[tool.setuptools.dynamic]
version = {attr = "ovos_phal_plugin_ipgeo.version.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["ovos_phal_plugin_ipgeo*"]

[tool.setuptools.package-data]
ovos_phal_plugin_ipgeo = ["*.json"]
